name: Weekly App Review Pulse

on:
  schedule:
    - cron: '0 9 * * 1'  # Run automatically every Monday at 09:00 UTC
  workflow_dispatch:      # Allow manual on-demand execution from GitHub Actions UI

jobs:
  weekly-pulse:
    name: Generate and Deliver Weekly Review Pulse
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Weekly Review Pulse Pipeline
        env:
          PHASE2_LLM_PROVIDER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PHASE3_LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_APP_ID: com.nextbillion.groww
          REVIEW_WINDOW_WEEKS: 8
          MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL || 'https://mcp-server-1-production-7ea1.up.railway.app/sse' }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
          PULSE_RECIPIENT_EMAIL: ${{ secrets.PULSE_RECIPIENT_EMAIL }}
        run: |
          python -m src.scheduler.runner --now

      - name: Upload Pulse Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-pulse-notes
          path: |
            data/weekly_pulse.md
            data/weekly_pulse.html
            data/scheduler_state.json
          retention-days: 30
